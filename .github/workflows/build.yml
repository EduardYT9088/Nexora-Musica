      # Firma de Música NX: NO la cambies nunca (si cambia, Android no deja actualizar la app).
      # Las contraseñas están en Secrets; sin ellas este archivo no sirve para firmar.
      - name: Firma
        run: echo '' | base64 -d > proyecto/app/release.jks

      - name: Versión automática y novedades
        id: ver
        env:
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, re
          run = int(os.environ['RUN'])
          ver = '1.0.' + str(run)
          lines = []
          try:
              lines = [l.strip() for l in open('novedades.md', encoding='utf-8-sig').read().splitlines()]
          except FileNotFoundError:
              pass
          for l in lines:
              m = re.match(r'^(?:versi[oó]n)[ :]*[vV]?(\d+\.\d+(?:\.\d+)?)', l, re.I)
              if m:
                  ver = m.group(1)
                  break
          # versionCode sale de la versión (1.6.1 -> 10601xxx) y no del número de compilación:
          # así sigue subiendo aunque cambies el nombre del repo o crees uno nuevo.
          pv = [int(x) for x in (ver.split('.') + ['0', '0'])[:3]]
          code = 10000000 + (pv[0] * 10000 + pv[1] * 100 + pv[2]) * 1000 + run % 1000
          # La app busca las actualizaciones en ESTE repo (aunque lo renombres)
          owner, name = os.environ['REPO'].split('/', 1)
          ip = 'proyecto/app/src/main/assets/index.html'
          h = open(ip, encoding='utf-8').read()
          h = re.sub(r"const REPO = '[^']*';", "const REPO = '" + os.environ['REPO'] + "';", h, count=1)
          h = re.sub(r"const PRIVACY_URL = '[^']*';", "const PRIVACY_URL = 'https://" + owner.lower() + ".github.io/" + name + "/privacidad.html';", h, count=1)
          open(ip, 'w', encoding='utf-8').write(h)
          opcional = any(l.lower().startswith('[opcional]') for l in lines)
          nov = [l[1:].strip() for l in lines if l.startswith('-') and l[1:].strip()]
          p = 'proyecto/app/build.gradle.kts'
          g = open(p, encoding='utf-8').read()
          g = re.sub(r'versionCode = \d+', 'versionCode = ' + str(code), g)
          g = re.sub(r'versionName = "[^"]*"', 'versionName = "' + ver + '"', g)
          open(p, 'w', encoding='utf-8').write(g)
          base = 'https://github.com/' + os.environ['REPO'] + '/releases/latest/download/'
          info = {'version': ver, 'code': code, 'obligatoria': not opcional, 'novedades': nov,
                  'apk': base + 'MusicaNX-arm64.apk', 'apk_arm64': base + 'MusicaNX-arm64.apk', 'apk_armv7': base + 'MusicaNX-armv7.apk'}
          json.dump(info, open('version.json', 'w', encoding='utf-8'), ensure_ascii=False)
          notes = 'Música NX v' + ver + '\n\n' + ''.join('- ' + x + '\n' for x in nov) + '\nDescarga MusicaNX-arm64.apk (celulares de los últimos años) o MusicaNX-armv7.apk (celulares antiguos y muchos televisores).'
          open('release-notes.md', 'w', encoding='utf-8').write(notes)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('version=' + ver + '\n')
          print('Versión', ver, 'código', code)
          PY

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: proyecto
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          ls proyecto/app/build/outputs/apk/release/
          cp proyecto/app/build/outputs/apk/release/app-arm64-v8a-release.apk MusicaNX-arm64.apk
          cp proyecto/app/build/outputs/apk/release/app-armeabi-v7a-release.apk MusicaNX-armv7.apk

      - name: Guardar APK en la compilación
        uses: actions/upload-artifact@v4
        with:
          name: MusicaNX-apk
          path: |
            MusicaNX-arm64.apk
            MusicaNX-armv7.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          TAG="v$VER"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then TAG="v$VER-build${{ github.run_number }}"; fi
          gh release create "$TAG" MusicaNX-arm64.apk MusicaNX-armv7.apk version.json \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "Música NX v$VER" \
            --notes-file release-notes.md \
            --latest
