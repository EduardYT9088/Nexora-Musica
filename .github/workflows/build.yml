          package com.nexora.musicanx

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors

          /**
           * Descargas para escuchar sin internet. Los archivos quedan en la memoria privada de la app
           * (files/offline/<id>.m4a y <id>.jpg) y solo Música NX los puede reproducir.
           */
          object Offline {
              private val running = ConcurrentHashMap<String, Boolean>()
              private val pool = Executors.newFixedThreadPool(2)
              private val ID = Regex("^[0-9]{1,15}$")
              private const val CHUNK = 2L * 1024 * 1024        // por partes: YouTube no frena las descargas así

              fun dir(c: Context) = File(c.filesDir, "offline").apply { mkdirs() }
              fun audio(c: Context, id: String) = File(dir(c), "$id.m4a")
              fun cover(c: Context, id: String) = File(dir(c), "$id.jpg")

              private fun emit(id: String, state: String, done: Long = 0, total: Long = 0, msg: String = "") {
                  MainActivity.emit(JSONObject().put("type", "dl").put("id", id).put("state", state)
                      .put("done", done).put("total", total).put("msg", msg))
              }

              fun start(c: Context, o: JSONObject) {
                  val id = o.optString("id")
                  val url = o.optString("url")
                  if (!ID.matches(id) || !url.startsWith("https://")) { emit(id, "error", msg = "Datos no válidos"); return }
                  if (running.putIfAbsent(id, true) != null) return
                  val app = c.applicationContext
                  pool.execute {
                      val tmp = File(dir(app), "$id.part")
                      try {
                          downloadRanged(url, o.optString("ua"), tmp) { done, total -> emit(id, "progress", done, total) }
                          val dst = audio(app, id)
                          if (dst.exists()) dst.delete()
                          if (!tmp.renameTo(dst)) throw Exception("No se pudo guardar")
                          val cov = o.optString("cover")
                          if (cov.startsWith("https://")) runCatching { downloadSimple(cov, cover(app, id)) }
                          emit(id, "done", dst.length(), dst.length())
                      } catch (e: Exception) {
                          tmp.delete()
                          emit(id, "error", msg = "No se pudo descargar. Revisa tu conexión.")
                      } finally {
                          running.remove(id)
                      }
                  }
              }

              private fun downloadRanged(url: String, ua: String, out: File, progress: (Long, Long) -> Unit) {
                  var done = 0L
                  var total = -1L
                  var last = 0L
                  FileOutputStream(out).use { fo ->
                      while (total < 0 || done < total) {
                          val end = done + CHUNK - 1
                          val c = URL(url).openConnection() as HttpURLConnection
                          c.connectTimeout = 15000
                          c.readTimeout = 30000
                          if (ua.isNotEmpty()) c.setRequestProperty("User-Agent", ua)
                          c.setRequestProperty("Range", "bytes=$done-$end")
                          try {
                              val code = c.responseCode
                              if (code != 206 && code != 200) throw Exception("HTTP $code")
                              if (code == 200) total = c.contentLengthLong
                              else {
                                  val cr = c.getHeaderField("Content-Range") ?: ""
                                  val t = cr.substringAfter('/', "").trim().toLongOrNull()
                                  if (t != null && t > 0) total = t
                              }
                              var got = 0L
                              c.inputStream.use { input ->
                                  val buf = ByteArray(64 * 1024)
                                  while (true) {
                                      val n = input.read(buf)
                                      if (n < 0) break
                                      fo.write(buf, 0, n)
                                      done += n; got += n
                                      val now = System.currentTimeMillis()
                                      if (now - last > 300) { last = now; progress(done, total) }
                                  }
                              }
                              if (code == 200) { total = done; break }
                              if (got == 0L) break
                              if (total < 0 && got < CHUNK) { total = done; break }
                          } finally {
                              c.disconnect()
                          }
                      }
                  }
                  if (done <= 0) throw Exception("Archivo vacío")
                  progress(done, done)
              }

              private fun downloadSimple(url: String, out: File) {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 10000; c.readTimeout = 15000
                  try { c.inputStream.use { i -> FileOutputStream(out).use { o -> i.copyTo(o) } } } finally { c.disconnect() }
              }

              fun delete(c: Context, id: String) {
                  if (!ID.matches(id)) return
                  audio(c, id).delete(); cover(c, id).delete()
              }

              fun list(c: Context): String {
                  val a = JSONArray()
                  dir(c).listFiles()?.forEach { f ->
                      if (f.name.endsWith(".m4a")) a.put(JSONObject().put("id", f.name.removeSuffix(".m4a")).put("size", f.length()))
                  }
                  return a.toString()
              }

              fun path(c: Context, id: String): String {
                  if (!ID.matches(id)) return ""
                  val f = audio(c, id)
                  return if (f.exists() && f.length() > 0) "file://" + f.absolutePath else ""
              }
          }
          APPEOF
          cat > app/src/main/java/com/nexora/musicanx/Np.java <<'APPEOF'
          package com.nexora.musicanx;

          import org.json.JSONObject;
          import org.schabi.newpipe.extractor.MediaFormat;
          import org.schabi.newpipe.extractor.NewPipe;
          import org.schabi.newpipe.extractor.ServiceList;
          import org.schabi.newpipe.extractor.downloader.Downloader;
          import org.schabi.newpipe.extractor.downloader.Request;
          import org.schabi.newpipe.extractor.downloader.Response;
          import org.schabi.newpipe.extractor.exceptions.ReCaptchaException;
          import org.schabi.newpipe.extractor.localization.ContentCountry;
          import org.schabi.newpipe.extractor.localization.Localization;
          import org.schabi.newpipe.extractor.services.youtube.YoutubeParsingHelper;
          import org.schabi.newpipe.extractor.stream.AudioStream;
          import org.schabi.newpipe.extractor.stream.DeliveryMethod;
          import org.schabi.newpipe.extractor.stream.StreamInfo;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.Collections;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.zip.GZIPInputStream;

          /**
           * Motor rápido de Música NX (NewPipe Extractor, Java puro): obtiene el audio de una
           * canción en 1-2 segundos, sin arrancar Python. Si falla, Yt usa yt-dlp.
           */
          public final class Np {
              private Np() {}

              private static volatile boolean ready = false;

              public static synchronized void init() {
                  if (ready) return;
                  try {
                      Locale lc = Locale.getDefault();
                      String l = lc.getLanguage() == null || lc.getLanguage().isEmpty() ? "es" : lc.getLanguage();
                      String c = lc.getCountry() == null || lc.getCountry().isEmpty() ? "US" : lc.getCountry().toUpperCase(Locale.ROOT);
                      NewPipe.init(new Http(), new Localization(l, c), new ContentCountry(c));
                      ready = true;
                  } catch (Throwable e) {
                      ready = false;
                  }
              }

              /** Mejor audio directo de un video: {url, ua, dur, title}. */
              public static JSONObject audio(String vid) throws Exception {
                  if (!ready) init();
                  if (!ready) throw new IllegalStateException("Motor rápido no disponible");
                  StreamInfo si = StreamInfo.getInfo(ServiceList.YouTube, "https://www.youtube.com/watch?v=" + vid);
                  List<AudioStream> auds = si.getAudioStreams() != null ? si.getAudioStreams() : Collections.<AudioStream>emptyList();
                  AudioStream best = null;
                  boolean bestM4a = false;
                  int bestBr = -1;
                  for (AudioStream a : auds) {
                      if (!a.isUrl() || a.getDeliveryMethod() != DeliveryMethod.PROGRESSIVE_HTTP) continue;
                      // Solo la pista de audio original (no doblajes automáticos)
                      try { if (a.getAudioTrackType() != null && !a.getAudioTrackType().name().equals("ORIGINAL")) continue; } catch (Throwable ignored) {}
                      boolean m4a = a.getFormat() == MediaFormat.M4A;
                      int br = a.getAverageBitrate();
                      if (best == null || (m4a && !bestM4a) || (m4a == bestM4a && br > bestBr)) {
                          best = a; bestM4a = m4a; bestBr = br;
                      }
                  }
                  if (best == null) throw new IllegalStateException("Sin audio directo");
                  String url = best.getContent();
                  return new JSONObject()
                      .put("url", url)
                      .put("ua", uaFor(url))
                      .put("dur", si.getDuration())
                      .put("title", si.getName() == null ? "" : si.getName())
                      .put("engine", "rapido");
              }

              static boolean isVision(String url) {
                  try { return YoutubeParsingHelper.isVisionOsStreamingUrl(url); } catch (Throwable e) { return false; }
              }

              static String uaFor(String url) {
                  try { return isVision(url) ? YoutubeParsingHelper.getVisionOsUserAgent(null) : Http.UA; } catch (Throwable e) { return Http.UA; }
              }

              // ================= descargador HTTP para el extractor =================
              static final class Http extends Downloader {
                  static final String UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:140.0) Gecko/20100101 Firefox/140.0";

                  @Override
                  public Response execute(Request request) throws IOException, ReCaptchaException {
                      String url = request.url();
                      HttpURLConnection con = (HttpURLConnection) new URL(url).openConnection();
                      try {
                          con.setConnectTimeout(10000);
                          con.setReadTimeout(15000);
                          con.setInstanceFollowRedirects(true);
                          con.setRequestMethod(request.httpMethod());
                          con.setRequestProperty("User-Agent", UA);
                          con.setRequestProperty("Accept-Encoding", "gzip");
                          for (Map.Entry<String, List<String>> h : request.headers().entrySet()) {
                              List<String> vs = h.getValue();
                              if (vs == null || vs.isEmpty()) continue;
                              con.setRequestProperty(h.getKey(), String.join(", ", vs));
                          }
                          byte[] data = request.dataToSend();
                          if (data != null) {
                              con.setDoOutput(true);
                              con.setFixedLengthStreamingMode(data.length);
                              try (OutputStream os = con.getOutputStream()) { os.write(data); }
                          }
                          int code = con.getResponseCode();
                          if (code == 429) throw new ReCaptchaException("reCaptcha Challenge requested", url);
                          InputStream in = code >= 400 ? con.getErrorStream() : con.getInputStream();
                          String body = "";
                          if (in != null) {
                              if ("gzip".equalsIgnoreCase(con.getContentEncoding())) in = new GZIPInputStream(in);
                              try (InputStream is = in) {
                                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                                  byte[] buf = new byte[16384]; int n;
                                  while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                                  body = new String(bo.toByteArray(), StandardCharsets.UTF_8);
                              }
                          }
                          Map<String, List<String>> hdrs = new LinkedHashMap<>();
                          for (Map.Entry<String, List<String>> e : con.getHeaderFields().entrySet()) {
                              if (e.getKey() != null) hdrs.put(e.getKey(), e.getValue());
                          }
                          return new Response(code, con.getResponseMessage(), hdrs, body, con.getURL().toString());
                      } finally {
                          con.disconnect();
                      }
                  }
              }
          }
