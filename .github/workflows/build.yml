          package com.nexora.musicanx

          import android.content.Context
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          /**
           * Motor yt-dlp de Música NX.
           * Obtiene el enlace de audio de un video de YouTube con un solo método:
           * varios clientes de YouTube a la vez, con la sesión de YouTube si el usuario la guardó.
           */
          object Yt {
              @Volatile var status = "prep"      // prep | updating | ready | error
              @Volatile var version = ""
              @Volatile private var started = false
              private val lock = Object()
              private val pool = Executors.newSingleThreadExecutor()
              private val timer = Executors.newSingleThreadScheduledExecutor()
              private val cache = ConcurrentHashMap<String, Pair<Long, JSONObject>>()

              private const val MULTI_ARGS = "youtube:player_client=default,tv_simply,android_vr,mweb,web_embedded;skip=dash,translated_subs"
              private const val CACHE_MS = 4L * 3600 * 1000      // los enlaces de YouTube caducan en unas 6 h
              private const val UPDATE_MS = 12L * 3600 * 1000

              fun cookies(c: Context) = File(c.filesDir, "cookies.txt")
              fun logged(c: Context) = cookies(c).exists()
              fun clearCache() = cache.clear()

              fun start(app: Context, onChange: () -> Unit) {
                  if (started) return
                  started = true
                  Thread { Np.init() }.start()          // motor rápido listo en cuanto abre la app
                  pool.execute {
                      try {
                          setStatus("prep", onChange)
                          YoutubeDL.getInstance().init(app)
                          version = YoutubeDL.getInstance().versionName(app) ?: ""
                          val sp = app.getSharedPreferences("nx", 0)
                          if (System.currentTimeMillis() - sp.getLong("ytdlpUpdate", 0) > UPDATE_MS) doUpdate(app, onChange)
                          setStatus("ready", onChange)
                      } catch (e: Throwable) {
                          setStatus("error", onChange)
                      }
                  }
              }

              private fun setStatus(s: String, onChange: () -> Unit) {
                  status = s
                  synchronized(lock) { lock.notifyAll() }
                  try { onChange() } catch (e: Exception) {}
              }

              /** Descarga la última versión estable de yt-dlp. Devuelve updated | current | error. */
              @Synchronized
              fun update(app: Context, onChange: () -> Unit): String {
                  if (status == "error" || status == "prep") return "error"
                  val r = doUpdate(app, onChange)
                  setStatus("ready", onChange)
                  return r
              }

              private fun doUpdate(app: Context, onChange: () -> Unit): String {
                  setStatus("updating", onChange)
                  var result = "current"
                  try {
                      val st = YoutubeDL.getInstance().updateYoutubeDL(app, YoutubeDL.UpdateChannel.STABLE)
                      if (st == YoutubeDL.UpdateStatus.DONE) result = "updated"
                      app.getSharedPreferences("nx", 0).edit().putLong("ytdlpUpdate", System.currentTimeMillis()).apply()
                      cache.clear()
                  } catch (e: Exception) {
                      result = "error"
                  }
                  version = YoutubeDL.getInstance().versionName(app) ?: version
                  return result
              }

              private fun awaitReady(ms: Long) {
                  val end = System.currentTimeMillis() + ms
                  synchronized(lock) {
                      while ((status == "prep" || status == "updating") && System.currentTimeMillis() < end) lock.wait(500)
                  }
                  if (status == "error") throw Exception("El motor no se pudo iniciar")
                  if (status != "ready") throw Exception("El motor aún se está preparando")
              }

              /** Solo el motor rápido (1-2 s). Lanza error si no lo consigue. */
              fun resolveFast(vid: String): JSONObject {
                  cache[vid]?.let { if (System.currentTimeMillis() - it.first < CACHE_MS) return it.second }
                  val o = Np.audio(vid)
                  if (o.optString("url").isEmpty()) throw Exception("Sin audio")
                  cache[vid] = Pair(System.currentTimeMillis(), o)
                  return o
              }

              /** Enlace de audio para un video: {url, ua, dur, title}. */
              fun resolve(app: Context, vid: String): JSONObject {
                  cache[vid]?.let { if (System.currentTimeMillis() - it.first < CACHE_MS) return it.second }
                  // 1) Motor rápido (NewPipe): 1-2 segundos
                  try {
                      val o = Np.audio(vid)
                      if (o.optString("url").isNotEmpty()) {
                          cache[vid] = Pair(System.currentTimeMillis(), o)
                          return o
                      }
                  } catch (e: Throwable) {}
                  // 2) Respaldo: yt-dlp con varios métodos de YouTube a la vez (y la sesión si existe)
                  awaitReady(90_000)
                  try {
                      val j = dump(app, "https://www.youtube.com/watch?v=$vid")
                      val a = bestAudio(j.optJSONArray("formats")) ?: throw Exception("Este video no tiene audio disponible")
                      val out = JSONObject()
                          .put("url", a.first).put("ua", a.second)
                          .put("dur", j.optDouble("duration", 0.0))
                          .put("title", j.optString("title"))
                      cache[vid] = Pair(System.currentTimeMillis(), out)
                      return out
                  } catch (e: Exception) {
                      throw Exception(clean(e.message))
                  }
              }

              private fun dump(app: Context, url: String): JSONObject {
                  val r = YoutubeDLRequest(url)
                  r.addOption("--no-playlist")
                  r.addOption("--dump-json")
                  r.addOption("--ignore-no-formats-error")
                  r.addOption("--no-warnings")
                  r.addOption("--socket-timeout", "15")
                  r.addOption("--extractor-retries", "1")
                  r.addOption("--extractor-args", MULTI_ARGS)
                  if (logged(app)) r.addOption("--cookies", cookies(app).absolutePath)
                  val res = run(r, "r_" + System.nanoTime(), 45L)
                  return lastJson(res)
              }

              /** Búsqueda de respaldo con yt-dlp: [{id, title, ch, dur}]. */
              fun search(app: Context, q: String): JSONArray {
                  awaitReady(30_000)
                  val r = YoutubeDLRequest("ytsearch8:$q")
                  r.addOption("--flat-playlist")
                  r.addOption("--dump-json")
                  r.addOption("--no-warnings")
                  r.addOption("--socket-timeout", "15")
                  if (logged(app)) r.addOption("--cookies", cookies(app).absolutePath)
                  val out = JSONArray()
                  for (line in run(r, "s_" + System.nanoTime(), 30L).lines()) {
                      val t = line.trim()
                      if (!t.startsWith("{")) continue
                      val j = try { JSONObject(t) } catch (e: Exception) { continue }
                      val id = j.optString("id")
                      if (id.length != 11) continue
                      out.put(JSONObject()
                          .put("id", id)
                          .put("title", j.optString("title"))
                          .put("ch", j.optString("channel").ifEmpty { j.optString("uploader") })
                          .put("dur", j.optDouble("duration", 0.0).toInt()))
                  }
                  return out
              }

              private fun run(r: YoutubeDLRequest, pid: String, timeoutS: Long): String {
                  val dog = timer.schedule({ YoutubeDL.getInstance().destroyProcessById(pid) }, timeoutS, TimeUnit.SECONDS)
                  try {
                      return YoutubeDL.getInstance().execute(r, pid, false, null).out
                  } catch (e: YoutubeDL.CanceledException) {
                      throw Exception("YouTube tardó demasiado en responder")
                  } finally {
                      dog.cancel(false)
                  }
              }

              private fun lastJson(out: String): JSONObject {
                  val lines = out.trim().split("\n")
                  for (i in lines.indices.reversed()) {
                      val l = lines[i].trim()
                      if (l.startsWith("{")) return JSONObject(l)
                  }
                  throw Exception("Respuesta vacía del motor")
              }

              /** Mejor audio directo (prefiere m4a, que Android reproduce en todas las versiones). */
              private fun bestAudio(fs: JSONArray?): Pair<String, String>? {
                  if (fs == null) return null
                  var best: JSONObject? = null
                  var bestM4a = false
                  var bestAbr = -1.0
                  for (i in 0 until fs.length()) {
                      val f = fs.optJSONObject(i) ?: continue
                      val url = f.optString("url")
                      if (url.isEmpty()) continue
                      val vc = f.optString("vcodec", "none")
                      val ac = f.optString("acodec", "none")
                      val hasV = vc != "none" && vc.isNotEmpty()
                      val hasA = ac != "none" && ac.isNotEmpty()
                      val proto = f.optString("protocol")
                      if (hasV || !hasA || (proto != "https" && proto != "http")) continue
                      val m4a = f.optString("ext") == "m4a"
                      val abr = f.optDouble("abr", 0.0)
                      if (best == null || (m4a && !bestM4a) || (m4a == bestM4a && abr > bestAbr)) {
                          best = f; bestM4a = m4a; bestAbr = abr
                      }
                  }
                  val b = best ?: return null
                  val ua = b.optJSONObject("http_headers")?.optString("User-Agent") ?: ""
                  return Pair(b.optString("url"), ua)
              }


              private fun clean(msg: String?): String {
                  val m = (msg ?: "").lowercase()
                  return when {
                      m.contains("not a bot") || m.contains("sign in to confirm") -> "YouTube pidió verificación. Inicia sesión en Perfil → Cuenta de YouTube."
                      m.contains("unavailable") || m.contains("private") -> "Este video no está disponible"
                      m.contains("tardó") -> "YouTube tardó demasiado en responder"
                      m.contains("motor") -> msg ?: "El motor no está listo"
                      else -> "No se pudo obtener el audio"
                  }
              }
          }
