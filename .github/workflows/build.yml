          package com.nexora.musicanx

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.io.FileOutputStream

          /**
           * Inicio de sesión en YouTube (opcional). La sesión se guarda solo en el teléfono,
           * en un archivo cookies.txt privado de la app, y la usa el motor al obtener las canciones.
           */
          class LoginActivity : Activity() {
              private lateinit var web: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#09090F"))

                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.gravity = Gravity.CENTER_VERTICAL
                  bar.setBackgroundColor(Color.parseColor("#16161F"))
                  val p = (12 * d).toInt()
                  bar.setPadding(p, p, p, p)

                  val tv = TextView(this)
                  tv.text = "Inicia sesión con una cuenta secundaria y luego toca Guardar."
                  tv.setTextColor(Color.parseColor("#F4F3FA"))
                  tv.textSize = 13f
                  bar.addView(tv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))

                  val save = Button(this)
                  save.text = "Guardar"
                  save.isAllCaps = false
                  save.setTextColor(Color.WHITE)
                  save.background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                      intArrayOf(Color.parseColor("#FF4D8D"), Color.parseColor("#8B5CFF"))).apply { cornerRadius = 22 * d }
                  save.setPadding((18 * d).toInt(), 0, (18 * d).toInt(), 0)
                  save.setOnClickListener { saveSession() }
                  bar.addView(save, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, (42 * d).toInt()))

                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  // Google no deja iniciar sesión si detecta "wv" (WebView) en el agente de usuario
                  web.settings.userAgentString = web.settings.userAgentString.replace("; wv", "")
                  web.webViewClient = WebViewClient()
                  val cm = CookieManager.getInstance()
                  cm.setAcceptCookie(true)
                  cm.setAcceptThirdPartyCookies(web, true)

                  root.addView(bar, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  root.addView(web, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)

                  web.loadUrl("https://accounts.google.com/ServiceLogin?service=youtube&continue=https%3A%2F%2Fm.youtube.com%2F")
              }

              private fun saveSession() {
                  val cm = CookieManager.getInstance()
                  cm.flush()
                  val c = cm.getCookie("https://www.youtube.com")
                  if (c == null || !(c.contains("SAPISID") || c.contains("__Secure-3PSID") || c.contains("LOGIN_INFO"))) {
                      Toast.makeText(this, "Primero termina de iniciar sesión en YouTube", Toast.LENGTH_LONG).show()
                      return
                  }
                  val exp = System.currentTimeMillis() / 1000 + 180L * 24 * 3600
                  val sb = StringBuilder("# Netscape HTTP Cookie File\n")
                  for (part in c.split(";")) {
                      val kv = part.trim()
                      val i = kv.indexOf('=')
                      if (i <= 0) continue
                      sb.append(".youtube.com\tTRUE\t/\tTRUE\t").append(exp).append('\t')
                          .append(kv.substring(0, i)).append('\t').append(kv.substring(i + 1)).append('\n')
                  }
                  try {
                      FileOutputStream(Yt.cookies(this)).use { it.write(sb.toString().toByteArray(Charsets.UTF_8)) }
                      Yt.clearCache()
                      Toast.makeText(this, "Sesión guardada", Toast.LENGTH_SHORT).show()
                      finish()
                  } catch (e: Exception) {
                      Toast.makeText(this, "No se pudo guardar la sesión", Toast.LENGTH_LONG).show()
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
