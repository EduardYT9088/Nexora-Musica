          package com.nexora.musicanx

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.drawable.Icon
          import android.media.AudioAttributes
          import android.media.AudioFocusRequest
          import android.media.AudioManager
          import android.media.MediaMetadata
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * Reproduce la música de Música NX en segundo plano (con ExoPlayer, ver Px), con controles en la notificación,
           * en la pantalla de bloqueo y en los audífonos. Precarga la siguiente canción para que
           * el cambio sea inmediato aunque la app esté cerrada o la pantalla apagada.
           * Todo se llama desde el hilo principal.
           */
          class AudioService : Service() {

              companion object {
                  private const val CH = "musicanx_play"
                  private const val NID = 7
                  const val ACT_START = "nx.START"
                  const val ACT_TOGGLE = "nx.TOGGLE"
                  const val ACT_NEXT = "nx.NEXT"
                  const val ACT_PREV = "nx.PREV"
                  const val ACT_CLOSE = "nx.CLOSE"

                  @Volatile var inst: AudioService? = null
                  private var pendingPlay: JSONObject? = null

                  // Siguiente canción precargada
                  private var nextMp: Px? = null
                  private var nextInfo: JSONObject? = null
                  private var nextReady = false

                  fun play(c: Context, o: JSONObject) {
                      val s = inst
                      if (s != null) { s.start(o); return }
                      pendingPlay = o
                      try {
                          c.startForegroundService(Intent(c, AudioService::class.java).setAction(ACT_START))
                      } catch (e: Exception) {
                          pendingPlay = null
                          MainActivity.emit(JSONObject().put("type", "bg").put("state", "error").put("id", o.optString("id")))
                      }
                  }

                  fun setNext(c: Context, o: JSONObject?) {
                      val url = o?.optString("url") ?: ""
                      if (url.isNotEmpty() && url == nextInfo?.optString("url")) return
                      releaseNext()
                      if (o == null || url.isEmpty()) return
                      try {
                          val p = newPlayer(c, url, o.optString("ua"))
                          nextMp = p; nextInfo = o; nextReady = false
                          p.setOnPreparedListener { x -> if (x === nextMp) nextReady = true }
                          p.setOnErrorListener { x, _, _ ->
                              if (x === nextMp) releaseNext() else try { x.release() } catch (e: Exception) {}
                              true
                          }
                          p.prepareAsync()
                      } catch (e: Exception) {
                          releaseNext()
                      }
                  }

                  private fun releaseNext() {
                      nextMp?.let { try { it.release() } catch (e: Exception) {} }
                      nextMp = null; nextInfo = null; nextReady = false
                  }

                  private fun newPlayer(c: Context, url: String, ua: String): Px = Px(c, url, ua)

                  fun toggle() { inst?.toggleP() }
                  fun pause() { inst?.pauseP() }
                  fun resume() { inst?.resumeP() }
                  fun seek(ms: Long) { inst?.seekP(ms) }
                  fun stop() { val s = inst; if (s != null) s.close() else releaseNext() }
                  /** Corta en seco la canción actual (aunque esté cargando) sin cerrar la notificación. */
                  fun halt() { inst?.haltP() }
                  fun state(): JSONObject = inst?.snapshot() ?: JSONObject().put("state", "idle")
              }

              private val main = Handler(Looper.getMainLooper())
              private var mp: Px? = null
              @Volatile private var prepared = false
              private var info = JSONObject()
              private var startPos = 0L
              @Volatile private var st = "idle"     // loading | playing | paused | ended | error
              private var ms: MediaSession? = null
              private var art: Bitmap? = null
              private var artUrl = ""
              private var focusReq: AudioFocusRequest? = null
              private var resumeOnGain = false
              private var noisyOn = false

              private val noisy = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) { pauseP() }   // audífonos desconectados
              }

              private val focusListener = AudioManager.OnAudioFocusChangeListener { f ->
                  when (f) {
                      AudioManager.AUDIOFOCUS_LOSS -> { resumeOnGain = false; pauseP() }
                      AudioManager.AUDIOFOCUS_LOSS_TRANSIENT -> { resumeOnGain = isPlaying(); pauseP() }
                      AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK -> try { mp?.setVolume(0.3f, 0.3f) } catch (e: Exception) {}
                      AudioManager.AUDIOFOCUS_GAIN -> {
                          try { mp?.setVolume(1f, 1f) } catch (e: Exception) {}
                          if (resumeOnGain) { resumeOnGain = false; resumeP() }
                      }
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  if (!noisyOn) {
                      if (Build.VERSION.SDK_INT >= 33) registerReceiver(noisy, IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY), Context.RECEIVER_NOT_EXPORTED)
                      else registerReceiver(noisy, IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY))
                      noisyOn = true
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  inst = this
                  when (intent?.action) {
                      ACT_START -> {
                          showNotification()
                          val p = pendingPlay
                          pendingPlay = null
                          if (p != null) start(p) else if (mp == null) close()
                      }
                      ACT_TOGGLE -> toggleP()
                      ACT_NEXT -> cmd("next")
                      ACT_PREV -> cmd("prev")
                      ACT_CLOSE -> close()
                      else -> { showNotification(); if (mp == null) close() }
                  }
                  return START_NOT_STICKY
              }

              fun start(o: JSONObject) {
                  releaseMain()
                  info = o
                  startPos = o.optLong("pos", 0)
                  prepared = false
                  st = "loading"
                  setArt(o.optString("art"))
                  showNotification()
                  requestFocus()
                  val url = o.optString("url")
                  val n = nextMp
                  if (n != null && nextInfo?.optString("url") == url) {
                      val ready = nextReady
                      nextMp = null; nextInfo = null; nextReady = false
                      attach(n)
                      if (ready) onPrepared(n)
                      return
                  }
                  try {
                      val p = newPlayer(this, url, o.optString("ua"))
                      attach(p)
                      p.prepareAsync()
                  } catch (e: Exception) {
                      st = "error"; emit("error"); updateSession(); showNotification()
                  }
              }

              private fun attach(p: Px) {
                  mp = p
                  p.setOnPreparedListener { onPrepared(it) }
                  p.setOnCompletionListener { onDone() }
                  p.setOnErrorListener { x, _, _ ->
                      if (x === mp) { prepared = false; st = "error"; emit("error"); updateSession(); showNotification() }
                      true
                  }
              }

              private fun onPrepared(p: Px) {
                  if (p !== mp || prepared) return
                  prepared = true
                  try {
                      if (startPos > 1000) p.seekTo(startPos, Px.SEEK_CLOSEST)
                      p.start()
                      st = "playing"
                  } catch (e: Exception) { st = "error" }
                  updateSession(); showNotification(); emit(st)
              }

              /** Terminó la canción: pasa a la precargada o avisa a la app. */
              private fun onDone() {
                  if (!advance()) {
                      st = "ended"
                      updateSession(); showNotification(); emit("ended")
                  }
              }

              private fun advance(): Boolean {
                  val n = nextMp ?: return false
                  val ni = nextInfo ?: return false
                  val ready = nextReady
                  nextMp = null; nextInfo = null; nextReady = false
                  releaseMain()
                  info = ni; startPos = 0; prepared = false; st = "loading"
                  setArt(ni.optString("art"))
                  attach(n)
                  MainActivity.emit(JSONObject().put("type", "bg").put("state", "advanced").put("id", ni.optString("id")))
                  if (ready) onPrepared(n) else { updateSession(); showNotification() }
                  return true
              }

              private fun isPlaying(): Boolean = try { prepared && mp?.isPlaying == true } catch (e: Exception) { false }

              fun toggleP() {
                  if (st == "ended" && prepared) { seekP(0); resumeP(); return }
                  if (isPlaying()) pauseP() else resumeP()
              }

              fun pauseP() {
                  val p = mp ?: return
                  if (!prepared) return
                  try { if (p.isPlaying) p.pause() } catch (e: Exception) {}
                  st = "paused"
                  updateSession(); showNotification(); emit("paused")
              }

              fun resumeP() {
                  val p = mp ?: return
                  if (!prepared) return
                  requestFocus()
                  try { p.start(); st = "playing" } catch (e: Exception) { st = "error" }
                  updateSession(); showNotification(); emit(st)
              }

              fun haltP() {
                  releaseMain()
                  st = "loading"
                  startPos = 0
                  updateSession()
              }

              fun seekP(ms: Long) {
                  val p = mp ?: return
                  if (!prepared) { startPos = ms; return }
                  try { p.seekTo(ms.coerceAtLeast(0), Px.SEEK_CLOSEST) } catch (e: Exception) {}
                  if (st == "ended") st = "paused"
                  updateSession()
              }

              fun snapshot(): JSONObject {
                  val o = JSONObject().put("state", st)
                      .put("id", info.optString("id")).put("title", info.optString("title"))
                      .put("artist", info.optString("artist")).put("art", info.optString("art"))
                  try {
                      val p = mp
                      if (p != null && prepared) { o.put("pos", p.currentPosition.toLong()); o.put("dur", p.duration.toLong()) }
                      else o.put("pos", startPos).put("dur", 0)
                  } catch (e: Exception) { o.put("pos", 0).put("dur", 0) }
                  o.put("next", nextInfo?.optString("id") ?: "")
                  return o
              }

              private fun cmd(c: String) {
                  if (MainActivity.current != null) {
                      MainActivity.emit(JSONObject().put("type", "cmd").put("cmd", c))
                      return
                  }
                  // La app está cerrada: la notificación sigue funcionando
                  if (c == "next") { if (advance()) return }
                  if (c == "prev") seekP(0)
              }

              fun close() {
                  releaseMain()
                  releaseNext()
                  abandonFocus()
                  ms?.let { it.isActive = false; it.release() }
                  ms = null
                  st = "idle"
                  try { stopForeground(STOP_FOREGROUND_REMOVE) } catch (e: Exception) {}
                  stopSelf()
                  inst = null
                  emit("stopped")
              }

              private fun releaseMain() {
                  mp?.let { try { it.release() } catch (e: Exception) {} }
                  mp = null
                  prepared = false
              }

              // ---------- Foco de audio (llamadas, otras apps) ----------
              private fun requestFocus() {
                  val am = getSystemService(AudioManager::class.java) ?: return
                  val r = focusReq ?: AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                      .setAudioAttributes(AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                      .setOnAudioFocusChangeListener(focusListener, main)
                      .build().also { focusReq = it }
                  am.requestAudioFocus(r)
              }

              private fun abandonFocus() {
                  val am = getSystemService(AudioManager::class.java) ?: return
                  focusReq?.let { am.abandonAudioFocusRequest(it) }
              }

              // ---------- Sesión multimedia (pantalla de bloqueo, Bluetooth, audífonos) ----------
              private fun ensureSession(): MediaSession {
                  ms?.let { return it }
                  val s = MediaSession(this, "MusicaNX")
                  s.setCallback(object : MediaSession.Callback() {
                      override fun onPlay() { resumeP() }
                      override fun onPause() { pauseP() }
                      override fun onSkipToNext() { cmd("next") }
                      override fun onSkipToPrevious() { cmd("prev") }
                      override fun onSeekTo(pos: Long) { seekP(pos) }
                      override fun onStop() { close() }
                  })
                  s.isActive = true
                  ms = s
                  return s
              }

              private fun updateSession() {
                  val s = ensureSession()
                  val mb = MediaMetadata.Builder()
                      .putString(MediaMetadata.METADATA_KEY_TITLE, info.optString("title"))
                      .putString(MediaMetadata.METADATA_KEY_ARTIST, info.optString("artist"))
                      .putString(MediaMetadata.METADATA_KEY_ALBUM, info.optString("album"))
                  try { val p = mp; if (p != null && prepared) mb.putLong(MediaMetadata.METADATA_KEY_DURATION, p.duration.toLong()) } catch (e: Exception) {}
                  art?.let { mb.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, it) }
                  s.setMetadata(mb.build())
                  var pos = 0L
                  try { val p = mp; if (p != null && prepared) pos = p.currentPosition.toLong() } catch (e: Exception) {}
                  val state = when (st) {
                      "playing" -> PlaybackState.STATE_PLAYING
                      "loading" -> PlaybackState.STATE_BUFFERING
                      "error" -> PlaybackState.STATE_ERROR
                      else -> PlaybackState.STATE_PAUSED
                  }
                  s.setPlaybackState(PlaybackState.Builder()
                      .setActions(PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or PlaybackState.ACTION_PLAY_PAUSE or
                          PlaybackState.ACTION_SKIP_TO_NEXT or PlaybackState.ACTION_SKIP_TO_PREVIOUS or
                          PlaybackState.ACTION_SEEK_TO or PlaybackState.ACTION_STOP)
                      .setState(state, pos, if (state == PlaybackState.STATE_PLAYING) 1f else 0f)
                      .build())
              }

              private fun action(act: String, code: Int): PendingIntent =
                  PendingIntent.getService(this, code, Intent(this, AudioService::class.java).setAction(act),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)

              private fun btn(icon: Int, label: String, act: String, code: Int): Notification.Action =
                  Notification.Action.Builder(Icon.createWithResource(this, icon), label, action(act, code)).build()

              private fun showNotification() {
                  val nm = getSystemService(NotificationManager::class.java) ?: return
                  if (nm.getNotificationChannel(CH) == null) {
                      nm.createNotificationChannel(NotificationChannel(CH, "Reproducción", NotificationManager.IMPORTANCE_LOW).apply {
                          setShowBadge(false)
                          description = "Controles de la música que suena"
                      })
                  }
                  val s = ensureSession()
                  val playing = st == "playing" || st == "loading"
                  val open = PendingIntent.getActivity(this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val n = Notification.Builder(this, CH)
                      .setSmallIcon(R.drawable.ic_launcher_mono)
                      .setContentTitle(info.optString("title").ifEmpty { "Música NX" })
                      .setContentText(info.optString("artist"))
                      .setSubText("Música NX")
                      .setLargeIcon(art)
                      .setContentIntent(open)
                      .setDeleteIntent(action(ACT_CLOSE, 9))
                      .setOngoing(playing)
                      .setShowWhen(false)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .addAction(btn(android.R.drawable.ic_media_previous, "Anterior", ACT_PREV, 1))
                      .addAction(btn(if (playing) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play,
                          if (playing) "Pausa" else "Reproducir", ACT_TOGGLE, 2))
                      .addAction(btn(android.R.drawable.ic_media_next, "Siguiente", ACT_NEXT, 3))
                      .setStyle(Notification.MediaStyle().setMediaSession(s.sessionToken).setShowActionsInCompactView(0, 1, 2))
                      .build()
                  try {
                      if (Build.VERSION.SDK_INT >= 29) startForeground(NID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                      else startForeground(NID, n)
                  } catch (e: Exception) {
                      nm.notify(NID, n)
                  }
              }

              // ---------- Portada para la notificación ----------
              private fun setArt(url: String) {
                  if (url == artUrl) return
                  artUrl = url
                  art = null
                  if (url.isEmpty()) return
                  Thread {
                      try {
                          val c = URL(url).openConnection() as HttpURLConnection
                          c.connectTimeout = 8000; c.readTimeout = 8000
                          val b = c.inputStream.use { BitmapFactory.decodeStream(it) } ?: return@Thread
                          val side = minOf(b.width, b.height)
                          var sq = Bitmap.createBitmap(b, (b.width - side) / 2, (b.height - side) / 2, side, side)
                          if (side > 512) sq = Bitmap.createScaledBitmap(sq, 512, 512, true)
                          main.post {
                              if (url != artUrl || inst !== this) return@post
                              art = sq
                              updateSession(); showNotification()
                          }
                      } catch (e: Exception) {}
                  }.start()
              }

              private fun emit(state: String) {
                  MainActivity.emit(JSONObject().put("type", "bg").put("state", state).put("id", info.optString("id")))
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  if (!isPlaying()) close()
                  super.onTaskRemoved(rootIntent)
              }

              override fun onDestroy() {
                  releaseMain()
                  abandonFocus()
                  if (noisyOn) { try { unregisterReceiver(noisy) } catch (e: Exception) {}; noisyOn = false }
                  ms?.release()
                  ms = null
                  if (inst === this) inst = null
                  super.onDestroy()
              }
          }
