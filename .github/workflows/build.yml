          package com.nexora.musicanx

          import android.app.Activity
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageInstaller
          import android.net.Uri
          import android.provider.Settings
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * Descarga la nueva versión de Música NX desde GitHub y la instala encima, dentro de la app.
           * Avisa del avance (bytes descargados y total) para mostrar porcentaje, velocidad y tiempo.
           * Android siempre muestra su ventana de confirmación antes de instalar.
           */
          object Updater {
              @Volatile private var running = false

              private fun emit(state: String, done: Long = 0, total: Long = 0, msg: String = "") {
                  MainActivity.emit(JSONObject().put("type", "upd").put("state", state)
                      .put("done", done).put("total", total).put("msg", msg))
              }

              fun canInstall(act: Activity): Boolean = act.packageManager.canRequestPackageInstalls()

              fun openPermission(act: Activity) {
                  runCatching {
                      act.startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + act.packageName)))
                  }
              }

              fun start(act: Activity, apkUrl: String) {
                  if (running) return
                  if (!apkUrl.startsWith("https://github.com/")) { emit("error", msg = "Enlace no válido"); return }
                  if (!canInstall(act)) {
                      // Primero hay que permitir "Instalar apps desconocidas" para Música NX.
                      emit("perm")
                      openPermission(act)
                      return
                  }
                  running = true
                  val app = act.applicationContext
                  Thread {
                      var sessionId = -1
                      try {
                          var url = URL(apkUrl)
                          var conn: HttpURLConnection
                          var hops = 0
                          while (true) {
                              conn = url.openConnection() as HttpURLConnection
                              conn.instanceFollowRedirects = false
                              conn.connectTimeout = 15000
                              conn.readTimeout = 30000
                              val code = conn.responseCode
                              if (code in 300..399 && hops++ < 6) {
                                  url = URL(url, conn.getHeaderField("Location")); conn.disconnect(); continue
                              }
                              if (code != 200) throw IllegalStateException("HTTP $code")
                              break
                          }
                          val total = conn.contentLengthLong
                          emit("start", 0, total)
                          val installer = app.packageManager.packageInstaller
                          val params = PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL)
                          params.setAppPackageName(app.packageName)
                          if (total > 0) params.setSize(total)
                          sessionId = installer.createSession(params)
                          installer.openSession(sessionId).use { session ->
                              conn.inputStream.use { input ->
                                  session.openWrite("MusicaNX.apk", 0, if (total > 0) total else -1).use { out ->
                                      val buf = ByteArray(64 * 1024)
                                      var done = 0L
                                      var last = 0L
                                      while (true) {
                                          val n = input.read(buf)
                                          if (n < 0) break
                                          out.write(buf, 0, n)
                                          done += n
                                          val now = System.currentTimeMillis()
                                          if (now - last > 200) { last = now; emit("progress", done, total) }
                                      }
                                      emit("progress", done, if (total > 0) total else done)
                                      session.fsync(out)
                                  }
                              }
                              conn.disconnect()
                              emit("installing")
                              val pi = PendingIntent.getBroadcast(app, 7,
                                  Intent(app, InstallResultReceiver::class.java),
                                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE)
                              session.commit(pi.intentSender)
                          }
                      } catch (e: Exception) {
                          if (sessionId >= 0) runCatching { app.packageManager.packageInstaller.abandonSession(sessionId) }
                          emit("error", msg = "No se pudo descargar. Revisa tu conexión.")
                      } finally {
                          running = false
                      }
                  }.start()
              }

              fun result(state: String) = emit(state)
          }

          /** Recibe la respuesta del instalador de Android. */
          class InstallResultReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.getIntExtra(PackageInstaller.EXTRA_STATUS, PackageInstaller.STATUS_FAILURE)) {
                      PackageInstaller.STATUS_PENDING_USER_ACTION -> {
                          @Suppress("DEPRECATION")
                          val confirm = intent.getParcelableExtra<Intent>(Intent.EXTRA_INTENT)
                          if (confirm != null) {
                              confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              runCatching { context.startActivity(confirm) }
                          }
                      }
                      PackageInstaller.STATUS_SUCCESS -> Updater.result("done")
                      PackageInstaller.STATUS_FAILURE_ABORTED -> Updater.result("cancel")
                      else -> Updater.result("failed")
                  }
              }
          }
