name: Construir APK de Música NX

# Plantilla de la Skill "apk-sin-pc".
# Convierte index.html (y los demás archivos web del repo) en una APK firmada
# y la publica en Releases junto con version.json (para la actualización dentro de la app).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar las contraseñas de la firma
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltan secretos. Ve a Settings > Secrets and variables > Actions y crea KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD."
            exit 1
          fi

      - name: Crear el proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proyecto && cd proyecto
          cat > settings.gradle.kts <<'APPEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); maven { url = uri("https://jitpack.io") } }
          }
          rootProject.name = "App"
          include(":app")
          APPEOF
          cat > build.gradle.kts <<'APPEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          APPEOF
          cat > gradle.properties <<'APPEOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          APPEOF
          mkdir -p app
          cat > app/build.gradle.kts <<'APPEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.nexora.musicanx"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.nexora.musicanx"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("release.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      // Sin reducir código: el motor yt-dlp (Python) usa reflexión
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              // Un APK por tipo de procesador (el motor incluye Python y pesa)
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "armeabi-v7a")
                      isUniversalApk = false
                  }
              }

              packaging {
                  jniLibs { useLegacyPackaging = true }
              }

              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              // Motor yt-dlp para Android (incluye Python y QuickJS)
              implementation("io.github.junkfood02.youtubedl-android:library:0.18.1")
              // Motor rápido (Java puro): el audio de una canción en 1-2 s
              implementation("com.github.TeamNewPipe:NewPipeExtractor:e8f89145a830b4d6cae32412007f24ea8b36c73a")
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.0.4")
              // Inicio de sesión con Google (token para Firebase)
              implementation("com.google.android.gms:play-services-auth:21.2.0")
              // Reproductor rápido (empieza a sonar con medio segundo de audio)
              implementation("androidx.media3:media3-exoplayer:1.4.1")
          }
          APPEOF
          cat > app/proguard-rules.pro <<'APPEOF'
          # Métodos que index.html llama desde JavaScript (sin esto, R8 los borra en release)
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepattributes JavascriptInterface
          APPEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'APPEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <!-- Android TV: la app también funciona sin pantalla táctil -->
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:banner="@drawable/ic_launcher_foreground"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.App"
                  android:hardwareAccelerated="true"
                      android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".LoginActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden" />

                  <receiver
                      android:name=".InstallResultReceiver"
                      android:exported="false" />

                  <service
                      android:name=".AudioService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          APPEOF
          mkdir -p app/src/main/java/com/nexora/musicanx
          cat > app/src/main/java/com/nexora/musicanx/MainActivity.kt <<'APPEOF'
          package com.nexora.musicanx

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.Toast
          import com.google.android.gms.auth.api.identity.GetSignInIntentRequest
          import com.google.android.gms.auth.api.identity.Identity
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.concurrent.Executors

          class MainActivity : Activity() {

              private lateinit var webView: WebView
              private lateinit var root: FrameLayout
              private var customView: View? = null
              private var fileCallback: ValueCallback<Array<Uri>>? = null
              private lateinit var chrome: WebChromeClient

              companion object {
                  // Origen https falso: index.html se sirve desde assets como si fuera un sitio web
                  const val HOST = "appassets.androidplatform.net"
                  const val START_URL = "https://$HOST/assets/index.html"
                  const val REQ_FILE = 41
                  const val REQ_NOTIF = 46
                  const val REQ_GOOGLE = 47
                  const val DESKTOP_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                  // Servidores a los que index.html puede pedir datos por el puente (catálogo y letras)
                  val ALLOWED_HOSTS = setOf("api.deezer.com", "lrclib.net", "github.com")
                  private val VIDEO_ID = Regex("^[A-Za-z0-9_-]{11}$")
                  private val main = Handler(Looper.getMainLooper())

                  /** Pantalla visible que recibe los avisos del motor y del reproductor. */
                  @Volatile var current: MainActivity? = null

                  fun emit(o: JSONObject) {
                      val a = current ?: return
                      a.js("window.nxEvent && nxEvent(${JSONObject.quote(o.toString())})")
                  }
              }

              private val io = Executors.newFixedThreadPool(4)

              private fun reply(id: String, ok: Boolean, data: String?) {
                  val r = JSONObject().put("ok", ok)
                  if (ok) r.put("data", data ?: "") else r.put("error", data ?: "error")
                  js("window.__cb && __cb(${JSONObject.quote(id)}, ${JSONObject.quote(r.toString())})")
              }

              private fun fetchText(url: String, headers: Map<String, String>): String {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 12000
                  c.readTimeout = 15000
                  c.instanceFollowRedirects = true
                  headers.forEach { (k, v) -> c.setRequestProperty(k, v) }
                  try {
                      val code = c.responseCode
                      val ok = code in 200..299
                      val stream = (if (ok) c.inputStream else c.errorStream) ?: throw Exception("HTTP $code")
                      val text = stream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                      if (!ok && code != 404) throw Exception("HTTP $code")
                      return text
                  } finally {
                      c.disconnect()
                  }
              }

              private fun extractInitialData(html: String): JSONObject? {
                  val keys = listOf("var ytInitialData = ", "window[\"ytInitialData\"] = ", "ytInitialData = ")
                  for (k in keys) {
                      val i = html.indexOf(k)
                      if (i < 0) continue
                      val start = html.indexOf('{', i)
                      if (start < 0) continue
                      val end = html.indexOf(";</script>", start)
                      if (end < 0) continue
                      return try { JSONObject(html.substring(start, end)) } catch (e: Exception) { null }
                  }
                  return null
              }

              private fun runsText(o: JSONObject?): String {
                  if (o == null) return ""
                  if (o.has("simpleText")) return o.optString("simpleText")
                  val runs = o.optJSONArray("runs") ?: return ""
                  val sb = StringBuilder()
                  for (k in 0 until runs.length()) sb.append(runs.optJSONObject(k)?.optString("text") ?: "")
                  return sb.toString()
              }

              private fun parseDur(s: String): Int {
                  var t = 0
                  for (p in s.split(":")) {
                      val n = p.trim().toIntOrNull() ?: return 0
                      t = t * 60 + n
                  }
                  return t
              }

              private fun collectVideos(node: Any?, out: JSONArray) {
                  if (out.length() >= 10) return
                  when (node) {
                      is JSONObject -> {
                          val vr = node.optJSONObject("videoRenderer")
                          if (vr != null) {
                              val vid = vr.optString("videoId")
                              if (vid.length == 11) {
                                  out.put(JSONObject()
                                      .put("id", vid)
                                      .put("title", runsText(vr.optJSONObject("title")))
                                      .put("ch", runsText(vr.optJSONObject("ownerText") ?: vr.optJSONObject("longBylineText")))
                                      .put("dur", parseDur(vr.optJSONObject("lengthText")?.optString("simpleText") ?: "")))
                              }
                              return
                          }
                          val keys = node.keys()
                          while (keys.hasNext()) {
                              collectVideos(node.opt(keys.next()), out)
                              if (out.length() >= 10) return
                          }
                      }
                      is JSONArray -> for (k in 0 until node.length()) {
                          collectVideos(node.opt(k), out)
                          if (out.length() >= 10) return
                      }
                  }
              }

              // ---------- Inicio de sesión con Google (token para Firebase) ----------
              private fun googleFail(msg: String?) {
                  emit(JSONObject().put("type", "google").put("ok", false).put("msg", msg ?: "error"))
              }

              private fun googleStart(clientId: String) {
                  if (clientId.isBlank()) { googleFail("noconfig"); return }
                  try {
                      val req = GetSignInIntentRequest.builder().setServerClientId(clientId).build()
                      Identity.getSignInClient(this).getSignInIntent(req)
                          .addOnSuccessListener { pi ->
                              runCatching { startIntentSenderForResult(pi.intentSender, REQ_GOOGLE, null, 0, 0, 0) }
                                  .onFailure { googleFail(it.message) }
                          }
                          .addOnFailureListener { e -> googleFail(e.message) }
                  } catch (e: Exception) {
                      googleFail(e.message)
                  }
              }

              private fun googleResult(resultCode: Int, data: Intent?) {
                  try {
                      val c = Identity.getSignInClient(this).getSignInCredentialFromIntent(data)
                      val tok = c.googleIdToken
                      if (tok == null) { googleFail("notoken"); return }
                      emit(JSONObject().put("type", "google").put("ok", true).put("token", tok)
                          .put("name", c.displayName ?: "").put("email", c.id)
                          .put("photo", c.profilePictureUri?.toString() ?: ""))
                  } catch (e: Exception) {
                      googleFail(if (resultCode == RESULT_OK) e.message else "cancel")
                  }
              }

              private fun emitEngine() {
                  emit(JSONObject().put("type", "engine").put("status", Yt.status).put("version", Yt.version))
              }

              private fun emitAccount() {
                  emit(JSONObject().put("type", "account").put("logged", Yt.logged(this)))
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  current = this
                  root = FrameLayout(this)
                  webView = WebView(this)
                  root.addView(webView, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                  setContentView(root)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = false
                      allowContentAccess = true
                      userAgentString = userAgentString + " AppWebView/" + versionName()
                  }
                  webView.isFocusable = true
                  webView.isFocusableInTouchMode = true
                  webView.addJavascriptInterface(Bridge(), "Android")
                  // El reproductor oficial de YouTube necesita cookies para funcionar dentro de la app
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? {
                          val url = request.url
                          if (url.host != HOST) return null
                          // Portadas de las canciones descargadas (funcionan sin internet)
                          if (url.path?.startsWith("/offline/") == true) {
                              val name = url.lastPathSegment ?: ""
                              val f = java.io.File(Offline.dir(this@MainActivity), name)
                              return if (Regex("^[0-9]{1,15}\\.jpg$").matches(name) && f.exists())
                                  WebResourceResponse("image/jpeg", null, f.inputStream())
                              else WebResourceResponse("text/plain", "utf-8", 404, "Not Found", emptyMap(), "".byteInputStream())
                          }
                          val path = url.path?.removePrefix("/assets/")?.ifEmpty { "index.html" } ?: return null
                          return try {
                              WebResourceResponse(mime(path), "utf-8", assets.open(path)).apply {
                                  responseHeaders = mapOf("Access-Control-Allow-Origin" to "*")
                              }
                          } catch (e: Exception) {
                              WebResourceResponse("text/plain", "utf-8", 404, "Not Found", emptyMap(), "".byteInputStream())
                          }
                      }

                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          val url = request.url
                          if (url.host == HOST) return false
                          // Enlaces externos (http, https, mailto…) se abren fuera de la app
                          return runCatching { startActivity(Intent(Intent.ACTION_VIEW, url)); true }.getOrDefault(true)
                      }
                  }

                  chrome = object : WebChromeClient() {
                      override fun onShowCustomView(view: View, callback: CustomViewCallback) {
                          customView = view
                          root.addView(view, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                          webView.visibility = View.GONE
                      }

                      override fun onHideCustomView() {
                          customView?.let { root.removeView(it) }
                          customView = null
                          webView.visibility = View.VISIBLE
                      }

                      override fun onShowFileChooser(view: WebView, callback: ValueCallback<Array<Uri>>, params: FileChooserParams): Boolean {
                          fileCallback?.onReceiveValue(null)
                          fileCallback = callback
                          return try {
                              startActivityForResult(params.createIntent(), REQ_FILE); true
                          } catch (e: Exception) {
                              fileCallback = null; false
                          }
                      }
                  }

                  webView.webChromeClient = chrome

                  if (savedInstanceState != null) webView.restoreState(savedInstanceState)
                  else webView.loadUrl(START_URL)

                  // Motor yt-dlp: se prepara (y se actualiza cada 12 h) en segundo plano
                  Yt.start(applicationContext) { emitEngine() }
                  askNotifications()
              }

              /** Android 13+: permiso para mostrar los controles de música en la notificación. */
              private fun askNotifications() {
                  if (Build.VERSION.SDK_INT < 33) return
                  if (checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED) return
                  val sp = getSharedPreferences("nx", 0)
                  if (sp.getBoolean("askedNotif", false)) return
                  sp.edit().putBoolean("askedNotif", true).apply()
                  requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), REQ_NOTIF)
              }

              private fun mime(path: String): String = when (path.substringAfterLast('.', "").lowercase()) {
                  "html", "htm" -> "text/html"
                  "js", "mjs" -> "text/javascript"
                  "css" -> "text/css"
                  "json" -> "application/json"
                  "svg" -> "image/svg+xml"
                  "png" -> "image/png"
                  "jpg", "jpeg" -> "image/jpeg"
                  "webp" -> "image/webp"
                  "gif" -> "image/gif"
                  "mp3" -> "audio/mpeg"
                  "mp4" -> "video/mp4"
                  "woff2" -> "font/woff2"
                  "ttf" -> "font/ttf"
                  else -> "application/octet-stream"
              }

              @Suppress("DEPRECATION")
              private fun versionCode(): Long = try {
                  val p = packageManager.getPackageInfo(packageName, 0)
                  if (Build.VERSION.SDK_INT >= 28) p.longVersionCode else p.versionCode.toLong()
              } catch (e: PackageManager.NameNotFoundException) { 0L }

              private fun versionName(): String = try {
                  packageManager.getPackageInfo(packageName, 0).versionName ?: "0"
              } catch (e: PackageManager.NameNotFoundException) { "0" }

              private fun js(code: String) = runOnUiThread { webView.evaluateJavascript(code, null) }

              // Todo lo que index.html puede pedirle a Android: window.Android.<método>()
              inner class Bridge {
                  @JavascriptInterface fun appInfo(): String = JSONObject()
                      .put("version", versionName())
                      .put("package", packageName)
                      .put("sdk", Build.VERSION.SDK_INT)
                      .put("tv", packageManager.hasSystemFeature("android.software.leanback"))
                      .put("code", versionCode())
                      .put("abi", Build.SUPPORTED_ABIS.firstOrNull() ?: "")
                      .toString()

                  @JavascriptInterface fun toast(msg: String) = runOnUiThread {
                      Toast.makeText(this@MainActivity, msg, Toast.LENGTH_SHORT).show()
                  }

                  @JavascriptInterface fun openUrl(url: String) = runOnUiThread {
                      runCatching { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url))) }
                  }

                  @JavascriptInterface fun share(text: String) = runOnUiThread {
                      val i = Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, text)
                      runCatching { startActivity(Intent.createChooser(i, null)) }
                  }

                  @Suppress("DEPRECATION")
                  @JavascriptInterface fun vibrate(ms: Int) {
                      val v = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator ?: return
                      val t = ms.toLong().coerceIn(1, 2000)
                      if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(t, VibrationEffect.DEFAULT_AMPLITUDE))
                      else v.vibrate(t)
                  }

                  @JavascriptInterface fun exitApp() = runOnUiThread { finish() }

                  // ---------- Datos: catálogo (Deezer) y letras (LRCLIB) ----------
                  @JavascriptInterface fun httpGet(id: String, url: String) {
                      io.execute {
                          try {
                              val u = Uri.parse(url)
                              if (u.scheme != "https" || u.host !in ALLOWED_HOSTS) throw Exception("Servidor no permitido")
                              reply(id, true, fetchText(url, mapOf(
                                  "User-Agent" to "MusicaNX/" + versionName() + " (Android)",
                                  "Accept" to "application/json")))
                          } catch (e: Exception) {
                              reply(id, false, e.message ?: "Sin conexión")
                          }
                      }
                  }

                  // Busca el video de la canción. Primero la búsqueda rápida; si falla, el motor yt-dlp.
                  @JavascriptInterface fun ytSearch(id: String, query: String) {
                      io.execute {
                          var out = JSONArray()
                          var err: String? = null
                          try {
                              val url = "https://www.youtube.com/results?search_query=" +
                                  URLEncoder.encode(query, "UTF-8") + "&sp=EgIQAQ%253D%253D"
                              val html = fetchText(url, mapOf(
                                  "User-Agent" to DESKTOP_UA,
                                  "Accept-Language" to "es-419,es;q=0.9,en;q=0.8",
                                  "Cookie" to "CONSENT=YES+cb; SOCS=CAI"))
                              extractInitialData(html)?.let { collectVideos(it, out) }
                          } catch (e: Exception) {
                              err = e.message
                          }
                          if (out.length() == 0) {
                              try { out = Yt.search(applicationContext, query) } catch (e: Exception) { if (err == null) err = e.message }
                          }
                          if (out.length() == 0 && err != null) reply(id, false, err) else reply(id, true, out.toString())
                      }
                  }

                  // ---------- Motor yt-dlp ----------
                  @JavascriptInterface fun engine(): String = JSONObject()
                      .put("status", Yt.status).put("version", Yt.version)
                      .put("logged", Yt.logged(this@MainActivity)).toString()

                  @JavascriptInterface fun engineUpdate(id: String) {
                      io.execute { reply(id, true, Yt.update(applicationContext) { emitEngine() }) }
                  }

                  @JavascriptInterface fun resolve(id: String, vid: String) {
                      io.execute {
                          try {
                              if (!VIDEO_ID.matches(vid)) throw Exception("Video no válido")
                              reply(id, true, Yt.resolve(applicationContext, vid).toString())
                          } catch (e: Exception) {
                              reply(id, false, e.message ?: "No se pudo obtener el audio")
                          }
                      }
                  }

                  @JavascriptInterface fun resolveFast(id: String, vid: String) {
                      io.execute {
                          try {
                              if (!VIDEO_ID.matches(vid)) throw Exception("Video no válido")
                              reply(id, true, Yt.resolveFast(vid).toString())
                          } catch (e: Throwable) {
                              reply(id, false, "Motor rápido sin respuesta")
                          }
                      }
                  }

                  // ---------- Cuenta ----------
                  @JavascriptInterface fun googleSignIn(clientId: String) = runOnUiThread { googleStart(clientId) }
                  @JavascriptInterface fun googleSignOut() = runOnUiThread { runCatching { Identity.getSignInClient(this@MainActivity).signOut() } }

                  // ---------- Descargas sin internet ----------
                  @JavascriptInterface fun dlStart(json: String) {
                      val o = try { JSONObject(json) } catch (e: Exception) { return }
                      Offline.start(this@MainActivity, o)
                  }
                  @JavascriptInterface fun dlDelete(id: String) = Offline.delete(this@MainActivity, id)
                  @JavascriptInterface fun dlList(): String = Offline.list(this@MainActivity)
                  @JavascriptInterface fun dlPath(id: String): String = Offline.path(this@MainActivity, id)

                  // ---------- Actualización dentro de la app ----------
                  @JavascriptInterface fun updStart(url: String) = runOnUiThread { Updater.start(this@MainActivity, url) }
                  @JavascriptInterface fun updCanInstall(): Boolean = Updater.canInstall(this@MainActivity)
                  @JavascriptInterface fun updPerm() = runOnUiThread { Updater.openPermission(this@MainActivity) }

                  // ---------- Cuenta de YouTube (opcional) ----------
                  @JavascriptInterface fun login() = runOnUiThread {
                      startActivity(Intent(this@MainActivity, LoginActivity::class.java))
                  }

                  @JavascriptInterface fun logout() {
                      Yt.cookies(this@MainActivity).delete()
                      Yt.clearCache()
                      runOnUiThread {
                          CookieManager.getInstance().removeAllCookies(null)
                          CookieManager.getInstance().flush()
                          emitAccount()
                      }
                  }

                  // ---------- Reproductor en segundo plano ----------
                  @JavascriptInterface fun audioPlay(json: String) {
                      val o = try { JSONObject(json) } catch (e: Exception) { return }
                      main.post { AudioService.play(this@MainActivity, o) }
                  }

                  @JavascriptInterface fun audioSetNext(json: String) {
                      val o = if (json.isEmpty()) null else try { JSONObject(json) } catch (e: Exception) { null }
                      main.post { AudioService.setNext(applicationContext, o) }
                  }

                  @JavascriptInterface fun audioToggle() { main.post { AudioService.toggle() } }
                  @JavascriptInterface fun audioPause() { main.post { AudioService.pause() } }
                  @JavascriptInterface fun audioResume() { main.post { AudioService.resume() } }
                  @JavascriptInterface fun audioSeek(ms: Double) { main.post { AudioService.seek(ms.toLong()) } }
                  @JavascriptInterface fun audioStop() { main.post { AudioService.stop() } }
                  @JavascriptInterface fun audioHalt() { main.post { AudioService.halt() } }
                  @JavascriptInterface fun audioState(): String = AudioService.state().toString()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  @Suppress("DEPRECATION")
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_GOOGLE) { googleResult(resultCode, data); return }
                  if (requestCode == REQ_FILE) {
                      fileCallback?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCallback = null
                  }
              }

              override fun onResume() {
                  super.onResume()
                  current = this
                  webView.onResume()
                  js("window.appOnResume && appOnResume()")
                  emitAccount()
                  emitEngine()
              }

              // No se pausa el WebView: la app sigue controlando la cola mientras suena en segundo plano.
              override fun onPause() {
                  js("window.appOnPause && appOnPause()")
                  super.onPause()
              }

              // Atrás: primero le pregunta a index.html si tiene algo abierto (menú, hoja, pantalla).
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (customView != null) { chrome.onHideCustomView(); return }
                  webView.evaluateJavascript("(window.appBack && window.appBack()) ? 'y' : 'n'") { r ->
                      if (r?.contains("y") != true) {
                          if (webView.canGoBack()) webView.goBack() else moveTaskToBack(true)
                      }
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              override fun onDestroy() {
                  if (current === this) current = null
                  webView.destroy()
                  super.onDestroy()
              }
          }
