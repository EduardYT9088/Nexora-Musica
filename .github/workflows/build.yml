          package com.nexora.musicanx

          import android.content.Context
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.datasource.DefaultDataSource
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.DefaultLoadControl
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory

          /**
           * Reproductor de una canción con ExoPlayer: empieza a sonar con medio segundo de audio
           * (MediaPlayer esperaba varios segundos). Se usa como el MediaPlayer de antes y siempre
           * desde el hilo principal; posición y duración se pueden leer desde cualquier hilo.
           */
          class Px(c: Context, url: String, ua: String) {
              companion object { const val SEEK_CLOSEST = 0 }

              private val p: ExoPlayer
              private val main = Handler(Looper.getMainLooper())
              private var released = false
              private var readyFired = false
              private var onPrep: ((Px) -> Unit)? = null
              private var onDone: ((Px) -> Unit)? = null
              private var onErr: ((Px, Int, Int) -> Boolean)? = null

              @Volatile var currentPosition: Long = 0L; private set
              @Volatile var duration: Long = 0L; private set

              init {
                  val http = DefaultHttpDataSource.Factory()
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(10000)
                      .setReadTimeoutMs(15000)
                  if (ua.isNotEmpty()) http.setUserAgent(ua)
                  val load = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(20000, 60000, 500, 1500)   // suena con 0,5 s de audio listo
                      .build()
                  p = ExoPlayer.Builder(c.applicationContext)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(DefaultDataSource.Factory(c.applicationContext, http)))
                      .setLoadControl(load)
                      .setWakeMode(C.WAKE_MODE_NETWORK)
                      .setAudioAttributes(AudioAttributes.Builder()
                          .setUsage(C.USAGE_MEDIA)
                          .setContentType(C.AUDIO_CONTENT_TYPE_MUSIC)
                          .build(), false)                               // el foco de audio lo maneja AudioService
                      .setHandleAudioBecomingNoisy(false)
                      .build()
                  p.playWhenReady = false
                  p.addListener(object : Player.Listener {
                      override fun onPlaybackStateChanged(state: Int) {
                          if (released) return
                          refresh()
                          if (state == Player.STATE_READY && !readyFired) { readyFired = true; onPrep?.invoke(this@Px) }
                          else if (state == Player.STATE_ENDED) onDone?.invoke(this@Px)
                      }
                      override fun onPlayerError(error: PlaybackException) {
                          if (!released) onErr?.invoke(this@Px, error.errorCode, 0)
                      }
                  })
                  p.setMediaItem(MediaItem.fromUri(Uri.parse(url)))
                  tick()
              }

              private fun refresh() {
                  if (released) return
                  try {
                      currentPosition = p.currentPosition.coerceAtLeast(0)
                      val d = p.duration
                      duration = if (d == C.TIME_UNSET || d < 0) 0L else d
                  } catch (e: Exception) {}
              }

              private fun tick() {
                  if (released) return
                  refresh()
                  main.postDelayed({ tick() }, 500)
              }

              fun setOnPreparedListener(f: (Px) -> Unit) { onPrep = f }
              fun setOnCompletionListener(f: (Px) -> Unit) { onDone = f }
              fun setOnErrorListener(f: (Px, Int, Int) -> Boolean) { onErr = f }

              fun prepareAsync() { p.prepare() }
              fun start() { if (p.playbackState == Player.STATE_ENDED) p.seekTo(0); p.playWhenReady = true; refresh() }
              fun pause() { p.playWhenReady = false; refresh() }
              val isPlaying: Boolean get() = !released && p.playWhenReady && p.playbackState != Player.STATE_ENDED
              fun seekTo(ms: Long, @Suppress("UNUSED_PARAMETER") mode: Int) { p.seekTo(ms.coerceAtLeast(0)); currentPosition = ms.coerceAtLeast(0) }
              fun setVolume(l: Float, @Suppress("UNUSED_PARAMETER") r: Float) { p.volume = l }

              fun release() {
                  if (released) return
                  released = true
                  main.removeCallbacksAndMessages(null)
                  onPrep = null; onDone = null; onErr = null
                  try { p.release() } catch (e: Exception) {}
              }
          }
